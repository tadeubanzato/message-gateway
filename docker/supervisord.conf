; Process supervisor for the single combined container.
;
; Deviation from the handoff spec's suggested s6-overlay: supervisord was used
; instead. Both are valid choices for supervising multiple processes (including
; a non-Python one, RabbitMQ's Erlang/OTP runtime) in one container; supervisord
; was picked here for a simpler, more debuggable config format and because it's
; a single pip dependency rather than a separate base-image layer to get right.
; Functionally equivalent for this project's needs — restart-on-crash for every
; process, unified logging to stdout/stderr, and a plain start order via
; priority numbers (lower starts first).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
priority=1
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/var/lib/rabbitmq",RABBITMQ_MNESIA_BASE="/data/rabbitmq/mnesia",RABBITMQ_LOG_BASE="/data/rabbitmq/log"

[program:api]
; Serves the HTTP API, portal, /get-started, /scalar docs, AND the MCP
; server (mounted at /mcp on this same process/port) — see app/main.py.
command=/app/docker/wait-for-rabbitmq.sh uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
priority=10
autorestart=true
environment=RABBITMQ_MANAGEMENT_PORT="15672"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:email_worker]
command=/app/docker/wait-for-rabbitmq.sh python -m app.workers.email_worker
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sms_worker]
command=/app/docker/wait-for-rabbitmq.sh python -m app.workers.sms_worker
