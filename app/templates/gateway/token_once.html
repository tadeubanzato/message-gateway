<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New API Token</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; background:#fff; color:#111; }
    .card { max-width: 820px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
    .token {
      font-family: monospace;
      font-size: 14px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      padding: 12px;
      border-radius: 10px;
      word-break: break-all;
      margin: 12px 0;
    }
    .muted { color:#6b7280; font-size: 12px; }
    a { color:#111; }
  </style>
</head>
<body>
  <div class="card">
    <h1>New API Token</h1>

    <p><strong>{{ warning }}</strong></p>

    <div class="muted">API Key (User Key): <span class="token" style="display:inline-block; padding:6px 10px;">{{ user_key }}</span></div>

    <div class="token">{{ raw_token }}</div>

    <p class="muted">
      This token will not be shown again. If you lose it, create a new token and revoke this one.
    </p>

    <p>
      <a href="/gateway/account">Back to account</a>
    </p>
  </div>
</body>
</html>
