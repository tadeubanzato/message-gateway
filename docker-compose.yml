name: message-gateway

services:
  gateway:
    build: .
    image: message-gateway:local
    restart: unless-stopped

    # No .env file is needed. Everything is set up in the browser and stored
    # encrypted in your database. This file is only read if you create one for
    # advanced overrides (see .env.example).
    env_file:
      - path: .env
        required: false

    environment:
      GATEWAY_BASE_URL: http://localhost:${MG_PORT:-8010}
      # Set by install.sh: the first-run setup needs this token, so the gateway can be
      # reachable from your network before the administrator exists without anyone
      # else being able to claim it.
      MG_SETUP_TOKEN: ${MG_SETUP_TOKEN:-}

    ports:
      # Bound to localhost by default, on purpose: the first-run setup page has
      # no login, so anyone who can reach this address before an administrator
      # account exists could create it. Once setup is finished (or if you'll
      # finish it over an SSH tunnel), allow other machines with:
      #   MG_BIND=0.0.0.0 ./install.sh
      # or set MG_BIND=0.0.0.0 in .env and `docker compose up -d`. Set MG_PORT
      # to use a different port. Never hardcode a specific hostname here - any
      # machine's install uses this same file.
      - "${MG_BIND:-127.0.0.1}:${MG_PORT:-8010}:8000"

    volumes:
      # Your database (when using local SQLite) AND the key that encrypts your
      # saved credentials live here. Back this volume up (see README).
      - gateway_data:/app/data
      - rabbitmq_data:/data/rabbitmq
      - ./app/templates:/app/app/templates:ro

volumes:
  gateway_data:
  rabbitmq_data:
