name: message-gateway

services:
  gateway:
    build: .
    image: message-gateway:local
    restart: unless-stopped

    # No .env file is needed. Everything is set up in the browser and stored
    # encrypted in your database. This file is only read if you create one for
    # advanced overrides (see .env.example).
    env_file:
      - path: .env
        required: false

    environment:
      GATEWAY_BASE_URL: http://localhost:${MG_PORT:-8010}
      # Set by install.sh: the first-run setup needs this token, so the gateway can be
      # reachable from your network before the administrator exists without anyone
      # else being able to claim it.
      MG_SETUP_TOKEN: ${MG_SETUP_TOKEN:-}

    ports:
      # Bound to localhost by default, on purpose: the first-run setup page has
      # no login, so anyone who can reach this address before an administrator
      # account exists could create it. Once setup is finished (or if you'll
      # finish it over an SSH tunnel), allow other machines with:
      #   MG_BIND=0.0.0.0 ./install.sh
      # or set MG_BIND=0.0.0.0 in .env and `docker compose up -d`. Set MG_PORT
      # to use a different port. Never hardcode a specific hostname here - any
      # machine's install uses this same file.
      - "${MG_BIND:-127.0.0.1}:${MG_PORT:-8010}:8000"

    volumes:
      # Your database (when using local SQLite) AND the key that encrypts your
      # saved credentials live here. Back this volume up (see README).
      - gateway_data:/app/data
      - rabbitmq_data:/data/rabbitmq
      - ./app/templates:/app/app/templates:ro
      # Where the gateway leaves the bundled SMSGate server its config (see below).
      - smsgate_config:/app/smsgate
      # Where the /reboot text command leaves its request for the host (it does
      # nothing unless you install host/install-reboot-helper.sh).
      - ./host-control:/app/host-control

  # ---------------------------------------------------------------------------
  # Optional: send SMS from your own Android phone (https://sms-gate.app).
  # Off unless the "smsgate" profile is on:
  #   MG_SMSGATE=1 ./install.sh        (or set COMPOSE_PROFILES=smsgate in .env)
  # None of these publish a port. The phone reaches the server through the
  # gateway (/api/mobile/...), and only the gateway calls its send API.
  # ---------------------------------------------------------------------------
  smsgate: &smsgate
    image: ghcr.io/android-sms-gateway/server:v1.49.0
    profiles: ["smsgate"]
    restart: unless-stopped
    environment: &smsgate-env
      # The private token phones register with is generated by the gateway and
      # read from this file; everything else is set here.
      CONFIG_PATH: /config/config.yml
      HTTP__LISTEN: 0.0.0.0:3000
      DATABASE__HOST: smsgate-db
      DATABASE__PORT: "3306"
      DATABASE__USER: smsgate
      DATABASE__PASSWORD: ${SMSGATE_DB_PASSWORD:-smsgate}
      DATABASE__DATABASE: smsgate
      DATABASE__TIMEZONE: UTC
    volumes:
      - smsgate_config:/config:ro
    depends_on:
      gateway:
        condition: service_healthy   # it writes the config file on startup
      smsgate-db:
        condition: service_healthy

  # Housekeeping for the server above (clears out old messages and devices).
  smsgate-worker:
    <<: *smsgate
    command: ["/app/app", "worker"]

  smsgate-db:
    image: mariadb:lts
    profiles: ["smsgate"]
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: smsgate
      MARIADB_USER: smsgate
      # Only reachable from the other containers in this file.
      MARIADB_PASSWORD: ${SMSGATE_DB_PASSWORD:-smsgate}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      # The paired phone's credentials and the server's message queue live here.
      - smsgate_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional web dashboard for the SMSGate server above: devices, messages and
  # their state on the phone. Its own profile, on top of "smsgate":
  #   COMPOSE_PROFILES=smsgate,smsgate-dashboard
  # Sign in with the username and password the Android app shows. Bound to this
  # machine only by default (http://localhost:3010); from another computer, use
  # an SSH tunnel:  ssh -L 3010:localhost:3010 <this machine>
  smsgate-dashboard:
    image: ghcr.io/android-sms-gateway/web-dashboard:v0.5.2
    profiles: ["smsgate-dashboard"]
    restart: unless-stopped
    environment:
      HTTP__ADDRESS: 0.0.0.0:3000
      GATEWAY__URL: http://smsgate:3000/api/3rdparty/v1
    ports:
      - "${SMSGATE_DASHBOARD_BIND:-127.0.0.1}:${SMSGATE_DASHBOARD_PORT:-3010}:3000"
      # Same again over IPv6: a .local hostname often resolves to an IPv6 address first.
      - "${SMSGATE_DASHBOARD_BIND6:-[::1]}:${SMSGATE_DASHBOARD_PORT:-3010}:3000"
    depends_on:
      - smsgate

volumes:
  gateway_data:
  rabbitmq_data:
  smsgate_config:
  smsgate_db:
