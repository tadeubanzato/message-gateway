services:
  gateway:
    build: .
    image: relay-gateway:local
    restart: unless-stopped

    # Optional: only needed for advanced overrides. Normal setup happens in the
    # browser at http://localhost:8010 and is stored encrypted in the database.
    env_file:
      - path: .env
        required: false

    ports:
      # Bound to localhost on purpose: the first-run setup page is unauthenticated.
      # To expose the gateway on your network, change to "8010:8000" after setup.
      - "127.0.0.1:8010:8000"  # HTTP API + portal + MCP server (same uvicorn process)
      - "127.0.0.1:15672:15672"  # RabbitMQ management UI — localhost only

    volumes:
      - gateway_data:/app/data         # SQLite DB file (when DB_BACKEND=sqlite)
      - rabbitmq_data:/data/rabbitmq   # RabbitMQ's own persistent state
      - ./app/templates:/app/app/templates:ro

volumes:
  gateway_data:
  rabbitmq_data:
